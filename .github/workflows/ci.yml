---
name: CI

on:
    push:
        branches: ["latest"]
        paths:
            - src/**
            - Cargo.toml
            - Cargo.lock
            - .github/workflows/ci.yml
    pull_request:
        branches: ["latest"]
    workflow_dispatch:
permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    SCCACHE_GHA_ENABLED: "true"
    RUSTC_WRAPPER: "sccache"

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: backfill_test
                    POSTGRES_USER: testuser
                    POSTGRES_HOST_AUTH_METHOD: trust
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                persist-credentials: false

            - name: sccache-cache
              uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696

            - name: Install Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
              with:
                  components: clippy, llvm-tools-preview
                  cache-directories: |
                      ~/.cargo/registry
                      ~/.cargo/bin
                      target

            - name: Install cargo-nextest and cargo-llvm-cov
              shell: bash
              run: |
                  if [[ -z $(which cargo-nextest) ]]; then
                    curl -sL https://get.nexte.st/latest/linux -o nextest.tgz
                    tar xfz nextest.tgz
                    mv cargo-nextest /home/runner/.cargo/bin
                  fi
                  if [[ -z $(which cargo-llvm-cov) ]]; then
                    curl -sL https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz -o cargo-llvm-cov.tgz
                    tar xfz cargo-llvm-cov.tgz
                    mv cargo-llvm-cov /home/runner/.cargo/bin
                  fi

            - name: Run clippy
              run: cargo clippy --all-targets -F axum

            - name: Run tests
              run: cargo nextest run -F axum -- --skip no_ci
              env:
                  DATABASE_URL: postgresql://testuser@localhost:5432/backfill_test

            - name: Run doctests
              run: cargo test --doc
              env:
                  DATABASE_URL: postgresql://testuser@localhost:5432/backfill_test

    fmt:
        name: formatting check
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                persist-credentials: false

            - name: Install nightly Rust
              uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
              with:
                  toolchain: nightly
                  components: rustfmt

            - name: check formatting
              run: cargo +nightly fmt --check --all
