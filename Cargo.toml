[package]
name = "backfill"
version = "3.0.0"
edition = "2024"
rust-version = "1.85"
description = "A boringly-named priority work queue system for doing async tasks."
categories = ["concurrency", "database"]
keywords = ["queue", "jobs", "postgresql", "graphile-worker", "async"]
authors = ["C J Silverio <ceejceej@gmail.com>"]
readme = "README.md"
license = "Parity-7.0.0"
repository = "https://github.com/ceejbot/backfill"
homepage = "https://github.com/ceejbot/backfill"

[features]
default = []
# Mounts the Axum admin router (`backfill::admin`). Off by default so
# library users without an HTTP layer don't pay the axum compile cost.
axum = ["dep:axum"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
# IMPORTANT: backfill queries graphile_worker's internal `_private_*` tables
# directly (cleanup, DLQ scanner, admin endpoints). The `_private_*` prefix
# signals these are internal API. Even within 0.11.x, a patch release that
# touches the internal schema can silently break backfill — re-run the
# integration tests against any new graphile_worker version before shipping.
graphile_worker = "0.11.1"
graphile_worker_crontab_parser = "0.5.12"
log = "0.4.28"
metrics = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros"] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }

# Optional dependencies for admin API
axum = { version = "0.8", optional = true }

[dev-dependencies]
axum = "0.8"
env_logger = "0.11"
fastrand = "2.0"
metrics-exporter-prometheus = "0.18.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Examples that require specific features
[[example]]
name = "admin_server"
required-features = ["axum"]

[lints.rust]
unsafe_code = { level = "deny", priority = 1 }
future_incompatible = { level = "deny", priority = 2 }
trivial_casts = { level = "warn", priority = 3 }
rust_2018_idioms = { level = "warn", priority = 4 }

[lints.clippy]
unwrap_used = "deny"
